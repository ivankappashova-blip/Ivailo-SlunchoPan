<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#FFB703" />
<title>Честит рожден ден, Слънчопан! ☀️</title>
<meta name="description" content="Лично място с пожелания за всеки рожден ден на Ивайло (Слънчопан)." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>" />
</head>
<body>

<!-- конфети / confetti layer -->
<canvas id="confetti" aria-hidden="true"></canvas>

<header class="hero">
  <div class="hero-sun">
    <svg class="sun" viewBox="0 0 240 240" aria-hidden="true">
      <defs>
        <radialGradient id="sunGrad" cx="50%" cy="36%" r="72%">
          <stop offset="0%" stop-color="#FFF3CD" />
          <stop offset="55%" stop-color="#FFD166" />
          <stop offset="100%" stop-color="#FFB703" />
        </radialGradient>
        <rect id="ray" x="115" y="6" width="10" height="40" rx="5" fill="#FFC53D" />
      </defs>
      <g class="rays">
        <use href="#ray" transform="rotate(0 120 122)" />
        <use href="#ray" transform="rotate(30 120 122)" />
        <use href="#ray" transform="rotate(60 120 122)" />
        <use href="#ray" transform="rotate(90 120 122)" />
        <use href="#ray" transform="rotate(120 120 122)" />
        <use href="#ray" transform="rotate(150 120 122)" />
        <use href="#ray" transform="rotate(180 120 122)" />
        <use href="#ray" transform="rotate(210 120 122)" />
        <use href="#ray" transform="rotate(240 120 122)" />
        <use href="#ray" transform="rotate(270 120 122)" />
        <use href="#ray" transform="rotate(300 120 122)" />
        <use href="#ray" transform="rotate(330 120 122)" />
      </g>
      <circle cx="120" cy="122" r="58" fill="url(#sunGrad)" />
      <circle cx="100" cy="112" r="7" fill="#8A5200" />
      <circle cx="140" cy="112" r="7" fill="#8A5200" />
      <path d="M97 137 q23 21 46 0" fill="none" stroke="#8A5200" stroke-width="7" stroke-linecap="round" />
    </svg>
  </div>

  <p class="hero-hi" data-i18n="hello">Честит рожден ден,</p>
  <h1 class="hero-name">
    <span data-name="name">Ивайло</span>
    <span class="name-nick" data-name="nickname">(Слънчопан)</span>
  </h1>
  <p class="hero-tag" data-i18n="tagline">Година след година, тук те чака по едно пожелание — само за теб.</p>

  <div class="hero-chips">
    <span id="chip-days" class="chip"></span>
  </div>

  <button id="langToggle" class="lang-toggle" type="button" aria-label="Смяна на езика / Switch language">
    <span data-lang="bg">БГ</span>
    <span data-lang="en">EN</span>
  </button>
</header>

<main>
  <section class="card section">
    <h2 class="section-title" data-i18n="calTitle">Календар</h2>
    <p class="section-sub" data-i18n="calSub">26 септември — твоят ден</p>

    <div class="cal-head">
      <button id="calPrev" class="cal-nav" type="button" aria-label="previous year">‹</button>
      <div id="calLabel" class="cal-label"></div>
      <button id="calNext" class="cal-nav" type="button" aria-label="next year">›</button>
    </div>

    <div id="weekdays" class="cal-weekdays"></div>
    <div id="calendar" class="cal-grid"></div>
    <p class="cal-hint" data-i18n="calHint">Натисни слънцето на 26-ти, за да отвориш пожеланието.</p>
  </section>

  <section class="section">
    <h2 class="section-title" data-i18n="tlTitle">Времева линия</h2>
    <p class="section-sub" data-i18n="tlSub">Отвори пожеланието за всяка година</p>
    <div id="timeline" class="timeline"></div>
  </section>
</main>

<footer class="footer">
  <p data-i18n="footer">Направено с много обич за Ивайло (Слънчопан) ☀️</p>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" type="button" data-close aria-label="close">×</button>

    <div class="modal-top">
      <div id="modalAge" class="modal-age"></div>
      <div class="modal-meta">
        <div id="modalYear" class="modal-year"></div>
        <div id="modalTitle" class="modal-title"></div>
      </div>
    </div>

    <div id="modalBody" class="modal-body"></div>

    <div id="modalLocked" class="modal-locked" hidden>
      <div class="lock-icon">🔒</div>
      <div id="modalLockedTitle" class="lock-title"></div>
      <div id="modalLockedSub" class="lock-sub"></div>
    </div>
  </div>
</div>

<script src="messages.js"></script>
<script src="app.js"></script>
</body>
</html>
